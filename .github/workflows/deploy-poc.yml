# Test version delivery: every push on the poc branch builds the site
# image, publishes it on GHCR, then deploys it on the test host of the VPS.
# Same steps as deploy.yml, with two differences: the image never gets the
# latest tag (it belongs to production), and the VPS service is poc.
name: Deploy POC

on:
  push:
    branches: [poc]

permissions: {}

concurrency:
  group: poc
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/camillebochard/evolve

jobs:
  publish:
    name: Build and publish the image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha-<short commit> to deploy or roll back, poc for a manual pull.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=sha
            type=raw,value=poc

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on the VPS
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The SSH secrets of production, which allows the poc branch too.
    environment:
      name: production
      url: https://poc.camillebochard.fr
    permissions: {}

    steps:
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"

      # The forced command passes "poc sha-<short commit>" to deploy.sh.
      - name: Run the deploy script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          image_tag="sha-${GITHUB_SHA::7}"
          ssh \
            -i "$RUNNER_TEMP/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            poc "$image_tag"
