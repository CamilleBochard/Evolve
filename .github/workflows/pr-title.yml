# Checks that every pull request title follows Conventional Commits.
# With squash merges, this title becomes the commit message on master.
name: PR title

on:
  pull_request:
    # "edited" reruns the check when the title changes; "synchronize" reruns
    # it on each new commit, so it always covers the latest commit.
    types: [opened, edited, reopened, synchronize]

# No permissions: the check only reads the title from the event payload.
permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: Conventional title
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      # The title goes through an environment variable, never straight into
      # the script: a crafted title cannot inject a command.
      - name: Check title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: .github/scripts/check-pr-title.sh
