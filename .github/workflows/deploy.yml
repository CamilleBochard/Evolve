# Production delivery: every push on master (so every merged pull request)
# builds the site image and publishes it on GHCR.
name: Deploy

on:
  push:
    branches: [master]

# Read the code, write the image to GHCR. Nothing else.
permissions:
  contents: read
  packages: write

# One delivery at a time, and never cancel one halfway through.
concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/camillebochard/evolve

jobs:
  publish:
    name: Build and publish the image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Actions pinned by commit SHA: a tag can be moved, a SHA cannot.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: sha-<short commit> to deploy or roll back a precise version,
      # latest for a manual pull.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      # Layer cache kept by GitHub Actions: npm ci is skipped when the
      # lockfile has not changed.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
