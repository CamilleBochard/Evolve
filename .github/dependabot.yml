# Automatic dependency updates.
version: 2

updates:
  # npm dependencies (package.json)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    # Wait before proposing a brand new release: a version published from a
    # compromised account is usually pulled within a few days. Does not apply
    # to security updates.
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    # Minor and patch updates grouped in one weekly pull request; each major
    # update comes alone, to be reviewed.
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # @types/node describes the Node API: its major must follow the Node
    # version in use (.nvmrc). It changes with Node, not before.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    # Titles that pass the Conventional Commits check:
    # "chore(deps): …" and "chore(deps-dev): …".
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope

  # GitHub Actions used by the workflows (pinned by SHA, updated together
  # with their version comment)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    # Titles: "ci(deps): …"
    commit-message:
      prefix: ci
      include: scope

  # Base images of the Dockerfile (pinned by digest, updated together with
  # their tag). One pull request per image: Node only affects the build,
  # nginx is what runs in production.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    # Docker only supports a single delay, not one per update type.
    cooldown:
      default-days: 7
    # The Node major follows .nvmrc and the engines field: it changes with
    # them, in a dedicated pull request, never alone.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    # Titles: "build(deps): …"
    commit-message:
      prefix: build
      include: scope
