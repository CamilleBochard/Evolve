# Security headers, included in every location of default.conf.
#
# nginx does not merge add_header across levels: a location that sets its
# own add_header (Cache-Control here) drops every add_header of the server
# block. Hence an include in each location rather than one server-level list.
#
# `always`: also sent with error responses (the 404 page), not only with
# 2xx and 3xx ones.
#
# HSTS is not here: Traefik adds it to every HTTPS response.

# Use the announced Content-Type, never guess it from the content.
add_header X-Content-Type-Options "nosniff" always;

# Other sites only see the domain the visitor comes from, not the full URL.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Browser features the site never uses, refused even to injected code.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Content Security Policy, limited for now to directives that cannot break
# what Astro generates:
#   frame-ancestors 'none'  no display inside a frame of another site
#                           (clickjacking); X-Frame-Options covers older browsers
#   object-src 'none'       no plugins (<object>, <embed>)
#   base-uri 'self'         an injected <base> cannot redirect relative links
#   form-action 'self'      an injected form cannot send data elsewhere
# script-src and style-src come with the React islands and the ClientRouter:
# they depend on the inline code Astro generates for them.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
