# Serveur du site statique, derrière Traefik (qui gère HTTPS).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ne pas annoncer la version de nginx dans les en-têtes et les pages d'erreur.
    server_tokens off;

    # Redirections relatives (/dossier -> /dossier/) : sinon nginx écrirait
    # son propre port (8080) dans l'URL, inaccessible derrière Traefik.
    absolute_redirect off;

    # Page 404 du site (générée par Astro) pour toute adresse inconnue.
    error_page 404 /404.html;

    # ---------- Compression ----------
    # Le HTML est toujours compressé quand gzip est actif ; on ajoute les
    # autres formats texte. Les images et les polices sont déjà compressées.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # ---------- Cache ----------
    # Fichiers générés par Astro : leur nom contient un hash de leur contenu.
    # Un nouveau contenu donne un nouveau nom, on peut donc les garder un an.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML et fichiers à nom fixe (favicon) : le navigateur revalide à chaque
    # visite. Si rien n'a changé, nginx répond 304 sans renvoyer le fichier.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
