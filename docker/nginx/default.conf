# Static site server, behind Traefik (which handles HTTPS).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version in headers and error pages.
    server_tokens off;

    # Relative redirects (/folder -> /folder/): otherwise nginx would write
    # its own port (8080) in the URL, unreachable behind Traefik.
    absolute_redirect off;

    # The site's 404 page (built by Astro) for any unknown URL.
    error_page 404 /404.html;

    # ---------- Compression ----------
    # HTML is always compressed when gzip is on; add the other text formats.
    # Images and fonts are already compressed.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # ---------- Cache ----------
    # Files generated by Astro: their name contains a hash of their content.
    # New content gets a new name, so they can be cached for a year.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML and fixed-name files (favicon): the browser revalidates on every
    # visit. If nothing changed, nginx answers 304 without resending the file.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
